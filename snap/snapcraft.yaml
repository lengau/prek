name: prek
title: prek
base: core26
version: 0.5.9
summary: A fast Git hook manager written in Rust.
description: |
  A fast Git hook manager written in Rust, designed as a drop-in
  alternative to pre-commit, reimagined.

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

parts:
  git:
    plugin: nil
    stage-packages:
      - git
      - openssh-client
      - ca-certificates
  prek:
    after:
      - git
    plugin: rust
    source: https://github.com/j178/prek.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    build-attributes:
      - enable-patchelf
    organize:
      prek: bin/prek
      lib*.so: lib/

apps:
  prek:
    command: bin/prek
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$SNAP/usr/lib/git-core:$PATH
      GIT_EXEC_PATH: $SNAP/usr/lib/git-core
      GIT_TEMPLATE_DIR: $SNAP/usr/share/git-core/templates
    plugs:
      - home
      - network
      # Some pre-commit hooks spin up local servers or bind ports for testing
      - network-bind
      - removable-media
      - ssh-keys
